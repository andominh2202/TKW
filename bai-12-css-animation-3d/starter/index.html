<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khởi Động Bài 12: CSS Animation & 3D Flip Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <header style="text-align: center; margin-bottom: 40px;">
      <h1>Thực Hành CSS Animation & Keyframes</h1>
      <p>Lập trình hiệu ứng lật thẻ 3D và quả cầu phát sáng</p>
    </header>

    <div class="demo-box">
      <!-- TODO 1: Tạo thẻ 3D Flip Card -->
      <div class="flip-card">
        <div class="flip-inner">
          <div class="flip-front">
            <h3>Mặt Trước Thẻ</h3>
            <p>Di chuột vào tôi để lật</p>
          </div>
          <div class="flip-back">
            <h3>Mặt Sau Thẻ</h3>
            <p>Nội dung bí mật được tiết lộ!</p>
          </div>
        </div>
      </div>

      <!-- TODO 2: Quả cầu Pulse -->
      <div class="pulse-stage">
        <div class="orb">⚡</div>
      </div>
    </div>
  </div>

</body>
</html>
